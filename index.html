<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Icons generated by scripts/brand-assets.mjs. %VARS% are filled from src/config/site.ts (vite.config.ts). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- theme-color = --color-espresso token -->
    <meta name="theme-color" content="#1a0f0a" />
    <title>%BRAND_NAME% | Coffee, Burgers &amp; Wraps in Islamabad</title>
    <meta
      name="description"
      content="%BRAND_NAME% (%ALT_NAME%): Islamabad's late-night coffee &amp; smash spot. Lattes, smash burgers and wraps. Order for delivery, takeaway or dine-in."
    />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%BRAND_NAME% | Coffee, Burgers &amp; Wraps in Islamabad" />
    <meta property="og:description" content="Sip. Bite. Repeat. Coffee, smash burgers &amp; wraps in Islamabad." />
    <meta property="og:image" content="%SITE_URL%/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%BRAND_NAME% logo: Sip. Bite. Repeat." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/brand/og-image.png" />
    <!--
      Static first frame of the 0→100 preloader, painted before any JS on EVERY full load (any route), so
      nothing (blank page, other loader) ever shows before it. The React <Preloader> (src/components/layout)
      draws the identical frame on top and removes this. Colours = oat token. No JS → hidden (noscript below).
    -->
    <script>
      document.documentElement.classList.add('mm-boot')
    </script>
    <noscript><style>#mm-boot { display: none !important; } .mm-boot, .mm-boot body { overflow: auto !important; }</style></noscript>
    <style>
      #mm-boot { display: none; }
      .mm-boot, .mm-boot body { background: #fff4e6; overflow: hidden; }
      .mm-boot #mm-boot { display: flex; position: fixed; inset: 0; z-index: 96; align-items: center; justify-content: center; background: #fff4e6; }
      #mm-boot img { height: min(46vh, 320px); width: auto; opacity: 0.14; }
    </style>
    <link rel="preload" as="image" href="/brand/logo-512.webp" type="image/webp" />
  </head>
  <body>
    <div id="mm-boot" aria-hidden="true"><img src="/brand/logo-512.webp" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
